name: Wijkwarm bijwerken

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/bijwerken.yml"
  schedule:
    - cron: "40 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bijwerken
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Ophalen en bouwen
        run: python pipeline/run.py
      - name: Committen
        run: |
          git config user.name "wijkwarm-bot"
          git config user.email "wijkwarm-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "geen wijzigingen"
            exit 0
          fi
          git commit -m "Update $(date -u +%Y-%m-%d)"
          git push
